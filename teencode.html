<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mÁy dỊcH tEeNc0dE</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background-color: #000000;
            color: #00ff00;
            text-align: center;
            padding: 20px;
            background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
        }
        .container {
            background-color: #111;
            max-width: 650px;
            margin: 0 auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 20px #ff00ff;
            border: 3px solid #ff00ff;
        }
        h1 {
            color: #ff00ff;
            font-size: 28px;
            text-shadow: 2px 2px 4px #fff;
        }
        marquee {
            color: #00ffff;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        textarea {
            width: 90%;
            height: 120px;
            margin: 10px 0;
            padding: 15px;
            border-radius: 5px;
            background-color: #222;
            color: #fff;
            border: 2px solid #00ff00;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            font-size: 18px;
            resize: none;
        }
        textarea:focus {
            outline: none;
            border-color: #ff00ff;
            box-shadow: 0 0 10px #ff00ff;
        }
        button {
            background-color: #ff00ff;
            color: white;
            padding: 15px 30px;
            border: 2px solid #fff;
            border-radius: 5px;
            font-size: 20px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            transition: 0.1s;
            margin: 10px 0;
        }
        button:hover {
            background-color: #00ff00;
            color: #000;
            border-color: #000;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>☠️ mÁy dỊcH tEeNc0dE lEvEl mAx ☠️</h1>
        <marquee scrollamount="10">~^^~ cHà0 mỪnG pẠn đẾn zỚi tHế jỚi cỦ4 nHữnG dÂn cHơI 4uDjtj0n ~^^~</marquee>
        
        <textarea id="inputText" placeholder="Gõ chữ người bình thường vào đây..."></textarea>
        
        <br>
        <button onclick="convertToHardcore()">hỦy dIệT cHữ vIếT !!!</button>
        <br>

        <textarea id="outputText" placeholder="kẾt qUả mÙ mẮt sẼ hIệN r4 Ở đÂy..." readonly></textarea>
    </div>

    <script>
        function convertToHardcore() {
            let text = document.getElementById('inputText').value.toLowerCase();

            const dict = {
                "không": "h0k", "ko": "k0", "khong": "k0",
                "biết": "pÍk", "biet": "pÉk",
                "thích": "tHíX", "thich": "tHíx",
                "buồn": "pÙn", "buon": "pÙn",
                "yêu": "jÊu", "yeu": "jÊu",
                "rồi": "rÙj", "roi": "r0àJ",
                "gì": "j`", "gi": "j`",
                "đâu": "âU", "dau": "âU",
                "vậy": "zẬy", "vay": "zẠy",
                "nhé": "nHéK", "nhe": "nHkÉ",
                "bạn": "pẠn", "ban": "pẠn",
                "quá": "wÁ", "qua": "wÁ",
                "đẹp": "đÉp", "dep": "đÉp",
                "đi": "đY", "di": "đY",
                "chào": "xÀ0", "chao": "xÀ0"
            };

            for (let [k, v] of Object.entries(dict)) {
                text = text.replace(new RegExp('\\b' + k + '\\b', 'gi'), v);
            }

            let chars = text.split('');
            for(let i = 0; i < chars.length; i++) {
                let c = chars[i];
                
                if ('aáàảãạăắằẳẵặâấầẩẫậ'.includes(c)) chars[i] = (Math.random() > 0.3) ? '4' : 'a';
                if ('eéèẻẽẹêếềểễệ'.includes(c)) chars[i] = (Math.random() > 0.4) ? '3' : 'e';
                if ('oóòỏõọôốồổỗộơớờởỡợ'.includes(c)) chars[i] = '0';
                if ('iíìỉĩị'.includes(c)) chars[i] = (Math.random() > 0.5) ? '1' : 'j';
                
                if (c === 'v') chars[i] = 'z';
                if (c === 'd' || c === 'đ') chars[i] = (Math.random() > 0.5) ? 'z' : 'd';
                if (c === 'g') chars[i] = 'j';
                if (c === 'c') chars[i] = 'k';
                if (c === 'b') chars[i] = 'p';
                if (c === 'q') chars[i] = 'w';
                if (c === 'y') chars[i] = 'j';
            }
            text = chars.join('');

            let result = "";
            for (let i = 0; i < text.length; i++) {
                result += (Math.random() > 0.4) ? text[i].toUpperCase() : text[i].toLowerCase();
            }

            const kaomoji = [" =]]", " =))", " >_<", " ~^^~", " *o*", " !!1!1!!", " :P", " \",\"", " =;", " T_T"];
            if (result.trim().length > 0) {
                 result += kaomoji[Math.floor(Math.random() * kaomoji.length)];
                 if (Math.random() > 0.5) {
                    result = kaomoji[Math.floor(Math.random() * kaomoji.length)] + " " + result;
                 }
            }

            document.getElementById('outputText').value = result;
        }
    </script>

</body>
</html>
